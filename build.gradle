
name: Build DAOT Limbs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check project files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f \( -name build.gradle -o -name build.gradle.kts \)

      - name: Build Fabric mod
        run: gradle build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daot-limbs-jar
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
